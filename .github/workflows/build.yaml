name: Build

on:
  pull_request: {}
  push: { branches: [main] }
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: StandaloneLinux64
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Unity
        uses: ./.github/actions/setup-unity
        with:
          editor-version: 2021.3.45f2
          license: ${{ secrets.UNITY_LICENSE }}

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-2021.3.45f2-StandaloneLinux64-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ runner.os }}-2021.3.45f2-StandaloneLinux64-

      - name: Build example player
        run: |
          unity --non-interactive build . \
            --editor-version 2021.3.45f2 \
            --target StandaloneLinux64 \
            --output-path Build/StandaloneLinux64/SerializeReferenceExtensions \
            --log-file Logs/build.log \
            --timeout 900
          tar -czf Build/StandaloneLinux64.tar.gz -C Build StandaloneLinux64

      - name: Upload player
        uses: actions/upload-artifact@v4
        with:
          name: StandaloneLinux64
          path: Build/StandaloneLinux64.tar.gz
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: Logs/
