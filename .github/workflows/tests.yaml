name: Tests

on:
  push:
    branches-ignore:
      - documentation
      - gh-pages
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: EditMode on Unity ${{ matrix.unityVersion }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        unityVersion:
          - 2021.3.45f2
          - 2023.2.22f1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Unity
        uses: ./.github/actions/setup-unity
        with:
          editor-version: ${{ matrix.unityVersion }}
          license: ${{ secrets.UNITY_LICENSE }}

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ matrix.unityVersion }}-EditMode-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ runner.os }}-${{ matrix.unityVersion }}-EditMode-

      - name: Run EditMode tests
        run: |
          unity --non-interactive test . \
            --editor-version "${{ matrix.unityVersion }}" \
            --mode EditMode \
            --output Logs/TestResults/editmode.xml \
            --timeout 900 \
            -- -nographics -logFile Logs/editmode.log

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.unityVersion }}-EditMode
          path: Logs/
