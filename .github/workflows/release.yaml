name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Package version and Git tag (for example 1.7.1).
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    env:
      TARGET_FILE: ./Assets/MackySoft/MackySoft.SerializeReferenceExtensions/package.json
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Create release app token
        id: release_app
        uses: actions/create-github-app-token@v3
        with:
          # GitHub accepts the existing App ID as a JWT issuer, as well as a client ID.
          client-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.release_app.outputs.token }}

      - name: Configure release app identity
        env:
          APP_SLUG: ${{ steps.release_app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
        run: |
          bot_login="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq '.id')"
          git config user.name "$bot_login"
          git config user.email "${bot_id}+${bot_login}@users.noreply.github.com"

      - name: Prepare release version
        id: metadata
        env:
          VERSION: ${{ inputs.tag }}
          RELEASE_REF: ${{ github.ref }}
        run: bash .github/scripts/release.sh prepare

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          lfs: true

      - name: Set up Unity
        uses: ./.github/actions/setup-unity
        with:
          editor-version: 2021.3.45f2
          email: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build example player
        run: |
          unity --non-interactive build . \
            --editor-version 2021.3.45f2 \
            --target StandaloneLinux64 \
            --output-path Build/StandaloneLinux64/SerializeReferenceExtensions \
            --log-file Logs/build.log \
            --timeout 900
          tar -czf Build/StandaloneLinux64.tar.gz -C Build StandaloneLinux64

      - name: Export unitypackage
        run: |
          unity --non-interactive run . \
            --editor-version 2021.3.45f2 \
            --log-file Logs/package.log \
            --timeout 900 \
            -- -nographics -executeMethod MackySoft.PackageTools.Editor.UnityPackageExporter.Export

      - name: check all .meta is commited
        run: |
          if git ls-files --others --exclude-standard -t | grep --regexp='[.]meta$'; then
            echo "Detected .meta file generated. Do you forgot commit a .meta file?"
            exit 1
          else
            echo "Great, all .meta files are commited."
          fi
        working-directory: .

      - name: Return Unity license
        if: always() && env.UNITY_LICENSE_ACTIVATION_ATTEMPTED == 'true'
        timeout-minutes: 5
        env:
          UNITY_EDITOR_VERSION: 2021.3.45f2
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash .github/actions/setup-unity/return-license.sh

      # Store artifacts.
      - name: Upload example player
        uses: actions/upload-artifact@v7
        with:
          name: StandaloneLinux64
          path: Build/StandaloneLinux64.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: SerializeReference-Extensions.unitypackage
          path: ./Build/SerializeReference-Extensions.unitypackage
          if-no-files-found: error

      - name: Upload Unity logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Release-Logs
          path: Logs/

  create-release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      # Each job owns a short-lived token; prepare's token is revoked before build.
      - name: Create release app token
        id: release_app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ steps.release_app.outputs.token }}

      # Publish the exact commit that produced the package. Recheck the remote
      # after the build, since another release may have created the tag meanwhile.
      - name: Create release tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: bash .github/scripts/release.sh create

      # Download the package artifact for the release.
      - uses: actions/download-artifact@v8
        with:
          name: SerializeReference-Extensions.unitypackage
          path: SerializeReference-Extensions.unitypackage
      
      # Create release and upload unitypackage.
      - uses: softprops/action-gh-release@v3
        with:
          token: ${{ steps.release_app.outputs.token }}
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          draft: true
          prerelease: false
          files: SerializeReference-Extensions.unitypackage/SerializeReference-Extensions.unitypackage
