name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "tag: git tag you want create. (sample 1.0.0)"
        required: true

env:
  GIT_TAG: ${{ github.event.inputs.tag }}
permissions:
  contents: write

jobs:
  update-packagejson:
    runs-on: ubuntu-latest
    env:
      TARGET_FILE: ./Assets/MackySoft/MackySoft.SerializeReferenceExtensions/package.json
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Output package.json (Before)
        run: cat ${{ env.TARGET_FILE}}

      - name: Update package.json to version ${{ env.GIT_TAG }}
        run: sed -i -e "s/\(\"version\":\) \"\(.*\)\",/\1 \"${{ env.GIT_TAG }}\",/" ${{ env.TARGET_FILE }}

      - name: Check update
        id: check_update
        run: |
          cat ${{ env.TARGET_FILE}}
          if ! git diff --exit-code; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit files
        id: commit
        if: steps.check_update.outputs.changed == '1'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "feat: Update package.json to ${{ env.GIT_TAG }}" -a
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check sha
        run: echo "SHA ${SHA}"
        env:
          SHA: ${{ steps.commit.outputs.sha }}

      - name: Create Tag
        if: steps.check_update.outputs.changed == '1'
        run: git tag ${{ env.GIT_TAG }}

      - name: Push changes
        if: steps.check_update.outputs.changed == '1'
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
          tags: true

  build:
    needs: [update-packagejson]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - run: echo ${{ needs.update-packagejson.outputs.sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-packagejson.outputs.sha }}
          lfs: true

      - name: Set up Unity
        uses: ./.github/actions/setup-unity
        with:
          editor-version: 2021.3.45f2
          email: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build example player
        run: |
          unity --non-interactive build . \
            --editor-version 2021.3.45f2 \
            --target StandaloneLinux64 \
            --output-path Build/StandaloneLinux64/SerializeReferenceExtensions \
            --log-file Logs/build.log \
            --timeout 900
          tar -czf Build/StandaloneLinux64.tar.gz -C Build StandaloneLinux64

      - name: Export unitypackage
        run: |
          unity --non-interactive run . \
            --editor-version 2021.3.45f2 \
            --log-file Logs/package.log \
            --timeout 900 \
            -- -nographics -executeMethod MackySoft.PackageTools.Editor.UnityPackageExporter.Export

      - name: check all .meta is commited
        run: |
          if git ls-files --others --exclude-standard -t | grep --regexp='[.]meta$'; then
            echo "Detected .meta file generated. Do you forgot commit a .meta file?"
            exit 1
          else
            echo "Great, all .meta files are commited."
          fi
        working-directory: .

      - name: Return Unity license
        if: always() && env.UNITY_LICENSE_ACTIVATION_ATTEMPTED == 'true'
        timeout-minutes: 5
        env:
          UNITY_EDITOR_VERSION: 2021.3.45f2
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash .github/actions/setup-unity/return-license.sh

      # Store artifacts.
      - name: Upload example player
        uses: actions/upload-artifact@v4
        with:
          name: StandaloneLinux64
          path: Build/StandaloneLinux64.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: SerializeReference-Extensions.unitypackage
          path: ./Build/SerializeReference-Extensions.unitypackage
          if-no-files-found: error

      - name: Upload Unity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Release-Logs
          path: Logs/

  create-release:
    needs: [update-packagejson, build]
    runs-on: ubuntu-latest
    steps:
      # Download the package artifact for the release.
      - uses: actions/download-artifact@v4
        with:
          name: SerializeReference-Extensions.unitypackage
          path: SerializeReference-Extensions.unitypackage
      
      # Create release and upload unitypackage.
      - uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.GIT_TAG }}
          name: ${{ env.GIT_TAG }}
          target_commitish: ${{ needs.update-packagejson.outputs.sha }}
          draft: true
          prerelease: false
          files: SerializeReference-Extensions.unitypackage/SerializeReference-Extensions.unitypackage
